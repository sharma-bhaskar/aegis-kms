name: Docker (main)

# Publishes `ghcr.io/<owner>/aegis-server:main` (and `:main-<sha>`) on every push to `main`.
# Separate from `release.yml` (which fires on `v*` tags) so the "what's on `main`" image stays
# fresh between tagged releases — so anything merged to `main` can be previewed ahead of the
# next `v*` tag without building from source.
#
# No external secrets — uses the built-in `GITHUB_TOKEN` for GHCR auth.

on:
  push:
    branches: [main]
    paths:
      # Skip docs-only commits — they don't change the server bytecode and we don't want a docker
      # rebuild for every typo fix. Adjust if a new server source-of-truth path lands.
      - 'modules/**'
      - 'build.sbt'
      - 'project/**'
      - '.github/workflows/docker-main.yml'

permissions:
  contents: read
  packages: write

concurrency:
  # One image build per ref at a time; cancel the older one if a newer push arrives.
  group: docker-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & publish :main
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6
        with:
          # sbt-dynver derives the version from `git describe`; full history avoids the
          # "fatal: no names found" warning that otherwise spams the build log.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          # Built-in sbt-aware cache (sbt + ivy2 + coursier). Matches release.yml so both
          # workflows share the same cache key shape.
          cache: sbt

      - name: Set up sbt
        # GitHub-hosted runners no longer ship sbt by default; without this step every
        # `sbt …` invocation below would fail with `sbt: command not found` (which is
        # exactly what the v1 of this workflow did on the merge of #69).
        uses: sbt/setup-sbt@v1

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build & publish image as :main and :main-<sha>
        env:
          GHCR_OWNER: ${{ steps.owner.outputs.value }}
          SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${SHA::7}"
          # The floating ":main" pointer is what the quickstart wedge demo references; ":main-<sha>"
          # is the immutable per-commit reference for anyone who needs reproducibility.
          #
          # GHCR intermittently rejects the manifest push with "unknown blob" even after every layer
          # has uploaded — a transient registry race, NOT a build failure (the image builds + stages
          # cleanly, and the identical Docker config pushed fine on the prior commit). Retry the
          # publish a few times so a flaky push doesn't red-X an otherwise-good main build.
          publish_tag() {
            local tag="$1"
            local attempt
            for attempt in 1 2 3; do
              if sbt \
                -Ddocker.username="ghcr.io/${GHCR_OWNER}" \
                "set server / Docker / dockerRepository := Some(\"ghcr.io/${GHCR_OWNER}\")" \
                "set server / Docker / dockerUpdateLatest := false" \
                "set server / Docker / version := \"${tag}\"" \
                "server / Docker / publish"; then
                return 0
              fi
              echo "::warning::docker publish of :${tag} failed (attempt ${attempt}/3); retrying in 20s"
              sleep 20
            done
            echo "::error::docker publish of :${tag} failed after 3 attempts"
            return 1
          }
          publish_tag "main"
          publish_tag "main-${SHORT_SHA}"

      - name: Note image tags
        env:
          GHCR_OWNER: ${{ steps.owner.outputs.value }}
          SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${SHA::7}"
          echo "::notice::Published ghcr.io/${GHCR_OWNER}/aegis-server:main and :main-${SHORT_SHA}"
