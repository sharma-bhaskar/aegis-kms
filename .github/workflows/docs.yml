name: Docs

# Builds the MkDocs Material site and deploys it to GitHub Pages.
# Triggered on every push to `main` that touches docs sources, or via the Actions tab.
#
# One-time setup (in the GitHub UI, not in this file):
#   Settings → Pages → Source: GitHub Actions
#
# Local preview:
#   pip install -r requirements-docs.txt
#   mkdocs serve
#   open http://127.0.0.1:8000

on:
  push:
    branches: [main]
    paths:
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'RELEASING.md'
      - 'ROADMAP.md'
      - 'SECURITY.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Required for the Pages deploy step
permissions:
  contents: read
  pages: write
  id-token: write

# Avoid concurrent deploys clobbering each other
concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs Material + plugins
        run: pip install -r requirements-docs.txt

      - name: Build site
        run: mkdocs build --strict --clean

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
