{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "aegis-kms.fullname" . }}-keystore
  labels:
    {{- include "aegis-kms.labels" . | nindent 4 }}
  annotations:
    # The software root-of-trust keystore is the only key material Aegis stores itself. Deleting
    # this volume makes everything wrapped by it permanently unrecoverable, so it outlives the
    # release rather than being garbage-collected with it.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
