{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aegis-kms.serviceAccountName" . }}
  labels:
    {{- include "aegis-kms.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Aegis calls no Kubernetes APIs, so it needs no RBAC and no mounted token. The ServiceAccount
# exists so cloud workload-identity annotations have somewhere to bind.
automountServiceAccountToken: false
{{- end }}
