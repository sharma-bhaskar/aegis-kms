apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "aegis-kms.fullname" . }}-test-connection"
  labels:
    {{- include "aegis-kms.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: smoke
      image: curlimages/curl:8.10.1
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop: [ALL]
      # Asserts more than "the port is open": /metrics must actually serve Prometheus exposition,
      # which means the HTTP plane booted and the meter registry is wired. A plain TCP check would
      # pass against a half-initialised process.
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          url="http://{{ include "aegis-kms.fullname" . }}:{{ .Values.service.port }}/metrics"
          echo "GET $url"
          body=$(curl -sS --fail --max-time 10 "$url")
          echo "$body" | grep -q '^# TYPE' || { echo "no Prometheus exposition in response"; exit 1; }
          echo "$body" | grep -q 'jvm_' || { echo "JVM metrics missing - server not fully booted"; exit 1; }
          echo "OK"
