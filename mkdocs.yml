site_name: Aegis-KMS
site_url: https://sharma-bhaskar.github.io/aegis-kms/
site_description: An open-source, agent-aware key management service for the era of LLM agents in production.
site_author: Bhaskar Sharma

repo_url: https://github.com/sharma-bhaskar/aegis-kms
repo_name: sharma-bhaskar/aegis-kms
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 Bhaskar Sharma — Apache 2.0

# ─── Theme ────────────────────────────────────────────────────────────────────

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

# ─── Extra CSS / JS ───────────────────────────────────────────────────────────

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sharma-bhaskar/aegis-kms
    - icon: fontawesome/brands/medium
      link: https://medium.com/@sharma-bhaskar
  generator: false
  status:
    new: Recently added
    deprecated: Deprecated

# ─── Markdown extensions ──────────────────────────────────────────────────────

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
      base_path:
        - .
        - docs
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# ─── Plugins ──────────────────────────────────────────────────────────────────

plugins:
  - search
  - include-markdown

# ─── Navigation ───────────────────────────────────────────────────────────────

nav:
  - Home: index.md

  - Getting Started:
    - Quickstart: getting-started/quickstart.md
    - Use-case guide: USE-CASES.md

  - Concepts:
    - Architecture: ARCHITECTURE.md
    - Usage walkthrough: USAGE.md
    - Positioning: POSITIONING.md

  - Operations:
    - Observability: operations/observability.md
    - Security: operations/security.md

  - Development:
    - Contributing: development/contributing.md
    - Developer Guide: development/developer-guide.md
    - Releasing: development/releasing.md

  - About:
    - Status: about/status.md
    - Comparison: about/comparison.md
    - Roadmap: about/roadmap.md
    - Changelog: about/changelog.md

# ─── Strict mode for CI ───────────────────────────────────────────────────────
# Set strict: true to fail builds on broken links / missing pages.
# We start permissive while the docs are being scaffolded.

strict: false
