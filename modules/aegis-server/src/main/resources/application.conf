aegis {
  http {
    host = "0.0.0.0"
    host = ${?AEGIS_HTTP_HOST}
    port = 8080
    port = ${?AEGIS_HTTP_PORT}
  }

  auth {
    # "dev"  — accepts X-Aegis-User header. Permissive — workstation use only.
    # "hmac" — requires Authorization: Bearer <jwt> signed with `hmac.secret`.
    # "oidc" — requires Authorization: Bearer <jwt> verified against the configured OIDC
    #          provider's JWKS endpoint (RS256 / RS384 / RS512 / ES256 / ES384 / ES512). The
    #          provider's discovery document is fetched once at boot to resolve `jwks_uri`;
    #          the JWKS itself is cached with the configured TTL and refreshed lazily on a
    #          kid-miss (handles key rotation without operator action).
    kind = "dev"
    kind = ${?AEGIS_AUTH_KIND}

    hmac {
      # MUST be ≥32 bytes. Set via AEGIS_AUTH_HMAC_SECRET; never commit a real secret.
      secret = ""
      secret = ${?AEGIS_AUTH_HMAC_SECRET}
    }

    oidc {
      # OIDC issuer URI (without the /.well-known/openid-configuration suffix — Aegis appends
      # it). Examples: https://accounts.google.com, https://keycloak.example.com/realms/aegis.
      issuer-uri = ""
      issuer-uri = ${?AEGIS_AUTH_OIDC_ISSUER_URI}

      # Expected `aud` claim. If non-empty, every token must have this audience or it's
      # rejected with `InvalidClaims`. Leave empty to accept any audience the issuer signs
      # (NOT recommended for production — token reuse across audiences becomes possible).
      audience = ""
      audience = ${?AEGIS_AUTH_OIDC_AUDIENCE}

      # JWKS cache TTL. Tokens use cached keys; once TTL expires the next verify triggers a
      # refresh. Default 3600 (1 hour) — most providers rotate keys at most daily; 1 hour
      # keeps Aegis within one cache-cycle of the provider's published key set without
      # hammering /jwks.json. Set lower in dev to test rotation; raise in production if your
      # IDP's JWKS endpoint is rate-limited.
      jwks-cache-ttl-seconds = 3600
      jwks-cache-ttl-seconds = ${?AEGIS_AUTH_OIDC_JWKS_CACHE_TTL_SECONDS}
    }
  }

  persistence {
    journal {
      # "in-memory"  — non-durable, suitable for tests and demos. State is lost on restart.
      # "postgres"   — Doobie/Hikari-backed Postgres. Bootstraps schema on startup.
      # "mysql"      — Doobie/Hikari-backed MySQL (#49). Bootstraps schema on startup.
      # "sqlite"     — Doobie/Hikari-backed SQLite (#50). Single-file embedded journal for
      #                laptops, CI, and single-node edge deployments. Pool size is forced to 1
      #                because SQLite serialises writes internally.
      kind = "in-memory"
      kind = ${?AEGIS_JOURNAL_KIND}

      postgres {
        jdbc-url  = "jdbc:postgresql://localhost:5432/aegis"
        jdbc-url  = ${?AEGIS_JDBC_URL}
        username  = "aegis"
        username  = ${?AEGIS_JDBC_USERNAME}
        password  = ""
        password  = ${?AEGIS_JDBC_PASSWORD}
        pool-size = 8
        pool-size = ${?AEGIS_JDBC_POOL_SIZE}
      }

      mysql {
        jdbc-url  = "jdbc:mysql://localhost:3306/aegis"
        jdbc-url  = ${?AEGIS_MYSQL_JDBC_URL}
        username  = "aegis"
        username  = ${?AEGIS_MYSQL_USERNAME}
        password  = ""
        password  = ${?AEGIS_MYSQL_PASSWORD}
        pool-size = 8
        pool-size = ${?AEGIS_MYSQL_POOL_SIZE}
      }

      sqlite {
        # File path or `:memory:`. The default is a file under /var/lib/aegis — adjust for your
        # deployment. NOTE: in-memory mode is connection-scoped under `Transactor.fromDriverManager`
        # and unsuitable for the embedded journal; use a file path for any durable use.
        jdbc-url = "jdbc:sqlite:/var/lib/aegis/journal.db"
        jdbc-url = ${?AEGIS_SQLITE_JDBC_URL}
      }
    }
  }

  policy {
    # "dev"        — DevPolicyEngine. Every Human + Service is allowed for every op; only the
    #                agent-scope recursion still gates. Suitable for the workstation demo and the
    #                wedge transcript; NEVER use in production. Default.
    # "role-based" — RoleBasedPolicyEngine. Humans pass only when (a) their `subject` is bound
    #                directly via `role-based.subject-bindings`, or (b) one of their `groups`
    #                (from OIDC claims / dev header) is bound via `role-based.role-bindings`.
    #                Services pass via subject bindings only. Agents recurse through the parent
    #                principal as in dev. Boot fails fast if `kind=role-based` is set with no
    #                bindings — silent allow-all would defeat the purpose of opting in.
    kind = "dev"
    kind = ${?AEGIS_POLICY_KIND}

    role-based {
      # role-bindings: group name → list of permitted KMIP Operation names.
      # subject-bindings: subject (sub claim) → list of permitted KMIP Operation names.
      # Empty by default; populate from your IdP's group taxonomy. Unknown operation names
      # fail fast at boot. Operation names are case-sensitive and match the enum cases in
      # `dev.aegiskms.core.Operation` (Create / Get / Locate / Activate / Revoke / Destroy /
      # Sign / Verify / Encrypt / Decrypt / Wrap / Unwrap / Rotate / Compromise / Query /
      # GetAttributes / AddAttribute).
      role-bindings    = {}
      subject-bindings = {}
    }
  }

  iam {
    revocation {
      # "none"      — no JTI kill-switch; tokens revoke only when they expire naturally.
      # "in-memory" — process-local revocation list. Lost on restart. Fine for single-node dev.
      # "redis"     — durable, multi-node revocation list backed by Redis. Production path —
      #               required if you want the auto-responder's `Revoke` action to also kill
      #               the offending agent's JWT before its natural expiry.
      kind = "in-memory"
      kind = ${?AEGIS_REVOCATION_KIND}

      redis {
        # Lettuce connection URI. Examples:
        #   redis://localhost:6379
        #   redis://:password@host:6379/0
        #   rediss://host:6380          (TLS)
        uri = ""
        uri = ${?AEGIS_REVOCATION_REDIS_URI}

        # Namespace prefix for revoked-jti keys. Lets you share a Redis with other workloads
        # (session stores, rate limiters) without colliding.
        key-prefix = "aegis:revoked-jti:"
        key-prefix = ${?AEGIS_REVOCATION_REDIS_KEY_PREFIX}
      }
    }
  }

  crypto {
    # "in-memory" — deterministic-MAC dev backend. NOT a real KMS. Signatures are HMAC(KeyId,
    #               msg); encryption is XOR-with-stream. Suitable for local dev, the wedge demo,
    #               and integration tests; never for production data.
    # "aws-kms"   — AwsKmsRootOfTrust against the configured AWS region. Requires `aws-kms.region`
    #               and `aws-kms.kek-arn` (the ARN of the customer master key used as the KEK in
    #               layered-mode key generation). Credentials come from the AWS SDK default
    #               provider chain (env vars, instance metadata, SSO, etc.).
    # GCP / Azure / Vault / PKCS#11 adapters are roadmapped for v0.3.0 / v0.4.0.
    kind = "in-memory"
    kind = ${?AEGIS_CRYPTO_KIND}

    aws-kms {
      region  = ""
      region  = ${?AEGIS_CRYPTO_AWS_KMS_REGION}
      kek-arn = ""
      kek-arn = ${?AEGIS_CRYPTO_AWS_KMS_KEK_ARN}
    }
  }

  audit {
    # "stdout"   — write every AuditRecord to stdout (default; what the docs/demos use).
    # "postgres" — write every AuditRecord to the `aegis_audit_events` table, indexed for the
    #              audit-read API (#20). Schema bootstraps on startup. Reuses the journal's
    #              Postgres credentials so operators only configure one set of DB env vars.
    kind = "stdout"
    kind = ${?AEGIS_AUDIT_KIND}

    retention {
      # Days of audit history to retain. `pruneBefore(now - days)` runs daily inside
      # `Server.boot`'s background fiber. Set to 0 to disable pruning entirely (audit grows
      # unbounded — fine for low-volume demos, NOT for production). Compliance regimes typically
      # require 365 days (SOC 2) or 7 years for SOX; tune accordingly.
      days = 365
      days = ${?AEGIS_AUDIT_RETENTION_DAYS}
    }

    # Optional SIEM webhook fan-out (#21). When `enabled=true`, every audit record is fanned out
    # to BOTH the primary durable sink (above) AND an async HTTPS POST to `url`. Primary failures
    # propagate (durability); webhook failures are bounded by retry + dead-letter (best-effort).
    # Typical production setup: `kind=postgres` (for the audit-read API #20) PLUS
    # `webhook.enabled=true` (for the SIEM).
    webhook {
      enabled = false
      enabled = ${?AEGIS_AUDIT_WEBHOOK_ENABLED}

      # HTTPS endpoint that receives one JSON-encoded AuditRecord per POST. Required when
      # enabled. Boot fails fast on empty URL.
      url = ""
      url = ${?AEGIS_AUDIT_WEBHOOK_URL}

      # HMAC-SHA256 signing key. Every POST carries `X-Aegis-Signature: sha256=<hex>` over the
      # raw body. Required when enabled (≥32 bytes recommended). Boot fails fast on empty secret.
      secret = ""
      secret = ${?AEGIS_AUDIT_WEBHOOK_SECRET}

      # Per-record retry budget. After this many consecutive transport / 5xx failures, the record
      # lands in the dead-letter file. 4xx responses (auth, malformed body) skip retry entirely.
      max-retries = 5
      max-retries = ${?AEGIS_AUDIT_WEBHOOK_MAX_RETRIES}

      # Initial backoff. Exponential thereafter, capped at max-backoff.
      initial-backoff-ms = 500
      initial-backoff-ms = ${?AEGIS_AUDIT_WEBHOOK_INITIAL_BACKOFF_MS}
      max-backoff-ms     = 30000
      max-backoff-ms     = ${?AEGIS_AUDIT_WEBHOOK_MAX_BACKOFF_MS}

      # JSONL dead-letter file. One record per line; safe to `cat dlq | xargs -I{} curl -d {}` to
      # re-deliver after the SIEM is back. Parent directory is auto-created on first write.
      dead-letter-file = "/var/lib/aegis/audit-webhook-dlq.jsonl"
      dead-letter-file = ${?AEGIS_AUDIT_WEBHOOK_DEAD_LETTER_FILE}

      # Bounded queue capacity. When the SIEM is slower than the audit rate, this fills up and
      # `write` blocks — which back-propagates through AuditingKeyService to the KMS call site.
      # The blocking is deliberate (silent drop would defeat the purpose of having an audit log).
      queue-capacity = 1024
      queue-capacity = ${?AEGIS_AUDIT_WEBHOOK_QUEUE_CAPACITY}
    }
  }
}

pekko {
  loglevel        = "INFO"
  loggers         = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  logging-filter  = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"

  http {
    server {
      # Populate `AttributeKeys.remoteAddress` on every incoming request so
      # `Endpoints.sourceIpInput` can read the socket's remote address and HttpRoutes
      # can stamp it into `AuditRecord.context("source.ip")` (closes #78). Default
      # in pekko-http is `off` for backwards compatibility, but the SourceIpBaseline
      # anomaly detector is inert without it.
      remote-address-attribute = on
    }
  }
}
