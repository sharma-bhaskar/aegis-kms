aegis {
  http {
    host = "0.0.0.0"
    host = ${?AEGIS_HTTP_HOST}
    port = 8080
    port = ${?AEGIS_HTTP_PORT}
  }

  auth {
    # "dev"  — accepts X-Aegis-User header. Permissive — workstation use only.
    # "hmac" — requires Authorization: Bearer <jwt> signed with `hmac.secret`.
    # "oidc" — requires Authorization: Bearer <jwt> verified against the configured OIDC
    #          provider's JWKS endpoint (RS256 / RS384 / RS512 / ES256 / ES384 / ES512). The
    #          provider's discovery document is fetched once at boot to resolve `jwks_uri`;
    #          the JWKS itself is cached with the configured TTL and refreshed lazily on a
    #          kid-miss (handles key rotation without operator action).
    kind = "dev"
    kind = ${?AEGIS_AUTH_KIND}

    hmac {
      # MUST be ≥32 bytes. Set via AEGIS_AUTH_HMAC_SECRET; never commit a real secret.
      secret = ""
      secret = ${?AEGIS_AUTH_HMAC_SECRET}
    }

    oidc {
      # OIDC issuer URI (without the /.well-known/openid-configuration suffix — Aegis appends
      # it). Examples: https://accounts.google.com, https://keycloak.example.com/realms/aegis.
      issuer-uri = ""
      issuer-uri = ${?AEGIS_AUTH_OIDC_ISSUER_URI}

      # Expected `aud` claim. If non-empty, every token must have this audience or it's
      # rejected with `InvalidClaims`. Leave empty to accept any audience the issuer signs
      # (NOT recommended for production — token reuse across audiences becomes possible).
      audience = ""
      audience = ${?AEGIS_AUTH_OIDC_AUDIENCE}

      # JWKS cache TTL. Tokens use cached keys; once TTL expires the next verify triggers a
      # refresh. Default 3600 (1 hour) — most providers rotate keys at most daily; 1 hour
      # keeps Aegis within one cache-cycle of the provider's published key set without
      # hammering /jwks.json. Set lower in dev to test rotation; raise in production if your
      # IDP's JWKS endpoint is rate-limited.
      jwks-cache-ttl-seconds = 3600
      jwks-cache-ttl-seconds = ${?AEGIS_AUTH_OIDC_JWKS_CACHE_TTL_SECONDS}
    }
  }

  persistence {
    journal {
      # "in-memory"  — non-durable, suitable for tests and demos. State is lost on restart.
      # "postgres"   — Doobie/Hikari-backed Postgres. Bootstraps schema on startup.
      # "mysql"      — Doobie/Hikari-backed MySQL (#49). Bootstraps schema on startup.
      # "sqlite"     — Doobie/Hikari-backed SQLite (#50). Single-file embedded journal for
      #                laptops, CI, and single-node edge deployments. Pool size is forced to 1
      #                because SQLite serialises writes internally.
      kind = "in-memory"
      kind = ${?AEGIS_JOURNAL_KIND}

      postgres {
        jdbc-url  = "jdbc:postgresql://localhost:5432/aegis"
        jdbc-url  = ${?AEGIS_JDBC_URL}
        username  = "aegis"
        username  = ${?AEGIS_JDBC_USERNAME}
        password  = ""
        password  = ${?AEGIS_JDBC_PASSWORD}
        pool-size = 8
        pool-size = ${?AEGIS_JDBC_POOL_SIZE}
      }

      mysql {
        jdbc-url  = "jdbc:mysql://localhost:3306/aegis"
        jdbc-url  = ${?AEGIS_MYSQL_JDBC_URL}
        username  = "aegis"
        username  = ${?AEGIS_MYSQL_USERNAME}
        password  = ""
        password  = ${?AEGIS_MYSQL_PASSWORD}
        pool-size = 8
        pool-size = ${?AEGIS_MYSQL_POOL_SIZE}
      }

      sqlite {
        # File path or `:memory:`. The default is a file under /var/lib/aegis — adjust for your
        # deployment. NOTE: in-memory mode is connection-scoped under `Transactor.fromDriverManager`
        # and unsuitable for the embedded journal; use a file path for any durable use.
        jdbc-url = "jdbc:sqlite:/var/lib/aegis/journal.db"
        jdbc-url = ${?AEGIS_SQLITE_JDBC_URL}
      }
    }
  }

  # Honey key (canary) registry (#26). Any agent operation against a KeyId listed here fires the
  # `HoneyKey` detector at Severity.High, which the AutoResponder.DefaultRules translate into a
  # Revoke action — killing both the key and the agent's JWT via the wired RevocationList.
  # Human operations against honey keys are NOT auto-revoked (operators may legitimately validate
  # the canary is alive); they still produce an audit row for review.
  #
  # Comma-separated string for the env-var path; HOCON-list syntax for the file path. Empty by
  # default — production deployments opt in explicitly.
  security {
    honey-keys = []
    honey-keys = ${?AEGIS_HONEY_KEYS}

    # Production preflight. At boot, Aegis cross-checks the bind address against dev-grade
    # settings (auth.kind=dev, policy.kind=dev, crypto.kind=in-memory, journal.kind=in-memory).
    # Loopback binds always pass. On a network-reachable bind:
    #   "warn"    — print one unmissable banner listing the findings, then continue (default;
    #               keeps `docker run` demos working out of the box).
    #   "enforce" — refuse to boot. Recommended for every production deployment: a crashed pod
    #               is cheaper than an open KMS.
    preflight = "warn"
    preflight = ${?AEGIS_SECURITY_PREFLIGHT}

    # Step-up authentication (#102). Gates the highest-blast-radius endpoint Aegis exposes:
    # POST /v1/agents/revoke, which can invalidate every credential an operator has issued.
    step-up {
      # Which OIDC `amr` (Authentication Methods References) values count as a genuine step-up.
      # `pwd` is deliberately absent: a password re-entry is what the user already did to get the
      # session, so accepting it would make step-up ceremonial. Set this to whatever your IDP
      # actually emits after an MFA challenge.
      methods = ["mfa", "otp", "hwk", "swk", "face", "fpt"]
      methods = ${?AEGIS_SECURITY_STEP_UP_METHODS}

      # How recently the human must have authenticated, in seconds. This is the condition doing the
      # real work: a long-lived token minted after a legitimate MFA login is exactly what an attacker
      # steals, and without a freshness bound it would satisfy an amr-only check forever.
      max-age-seconds = 300
      max-age-seconds = ${?AEGIS_SECURITY_STEP_UP_MAX_AGE_SECONDS}
    }
  }

  # AI advisor (#28/#29). `scan` is always available (deterministic). `explain` adds an optional
  # natural-language narrative when an LLM provider is configured below. `provider = none` (default)
  # keeps everything deterministic — no outbound LLM calls, no API key required.
  advisor {
    llm {
      # none | anthropic | openai | ollama
      provider  = "none"
      provider  = ${?AEGIS_ADVISOR_LLM_PROVIDER}
      # Required for anthropic / openai; ignored by ollama.
      api-key   = ""
      api-key   = ${?AEGIS_ADVISOR_LLM_API_KEY}
      # Optional override of the provider's default endpoint (proxies / gateways / local ollama).
      base-url  = ""
      base-url  = ${?AEGIS_ADVISOR_LLM_BASE_URL}
      # Optional model override; each provider has a sensible default.
      model     = ""
      model     = ${?AEGIS_ADVISOR_LLM_MODEL}
      max-tokens = 1024
    }
  }

  policy {
    # "dev"        — DevPolicyEngine. Every Human + Service is allowed for every op; only the
    #                agent-scope recursion still gates. Suitable for the workstation demo and the
    #                wedge transcript; NEVER use in production. Default.
    # "role-based" — RoleBasedPolicyEngine. Humans pass only when (a) their `subject` is bound
    #                directly via `role-based.subject-bindings`, or (b) one of their `groups`
    #                (from OIDC claims / dev header) is bound via `role-based.role-bindings`.
    #                Services pass via subject bindings only. Agents recurse through the parent
    #                principal as in dev. Boot fails fast if `kind=role-based` is set with no
    #                bindings — silent allow-all would defeat the purpose of opting in.
    kind = "dev"
    kind = ${?AEGIS_POLICY_KIND}

    role-based {
      # role-bindings: group name → list of permitted KMIP Operation names.
      # subject-bindings: subject (sub claim) → list of permitted KMIP Operation names.
      # Empty by default; populate from your IdP's group taxonomy. Unknown operation names
      # fail fast at boot. Operation names are case-sensitive and match the enum cases in
      # `dev.aegiskms.core.Operation` (Create / Get / Locate / Activate / Revoke / Destroy /
      # Sign / Verify / Encrypt / Decrypt / Wrap / Unwrap / Rotate / Compromise / Query /
      # GetAttributes / AddAttribute).
      role-bindings    = {}
      subject-bindings = {}
    }
  }

  iam {
    revocation {
      # "none"      — no JTI kill-switch; tokens revoke only when they expire naturally.
      # "in-memory" — process-local revocation list. Lost on restart. Fine for single-node dev.
      # "redis"     — durable, multi-node revocation list backed by Redis. Production path —
      #               required if you want the auto-responder's `Revoke` action to also kill
      #               the offending agent's JWT before its natural expiry.
      kind = "in-memory"
      kind = ${?AEGIS_REVOCATION_KIND}

      redis {
        # Lettuce connection URI. Examples:
        #   redis://localhost:6379
        #   redis://:password@host:6379/0
        #   rediss://host:6380          (TLS)
        uri = ""
        uri = ${?AEGIS_REVOCATION_REDIS_URI}

        # Namespace prefix for revoked-jti keys. Lets you share a Redis with other workloads
        # (session stores, rate limiters) without colliding.
        key-prefix = "aegis:revoked-jti:"
        key-prefix = ${?AEGIS_REVOCATION_REDIS_KEY_PREFIX}
      }
    }
  }

  auto-response {
    kill-fleet {
      # When true, the auto-responder may fire `KillAgentFleet` — revoking EVERY live agent under the
      # offending agent's parent operator, with no human in the loop. Off by default and deliberately
      # not in the default rule set: one false positive takes out an operator's entire fleet, not one
      # credential. Enabling this is a considered decision about blast radius, not a tuning knob.
      enabled = false
      enabled = ${?AEGIS_AUTO_RESPONSE_KILL_FLEET_ENABLED}
    }
  }

  crypto {
    # "in-memory" — deterministic-MAC dev backend. NOT a real KMS. Signatures are HMAC(KeyId,
    #               msg); encryption is XOR-with-stream. Suitable for local dev, the wedge demo,
    #               and integration tests; never for production data.
    # "software"  — SoftwareRootOfTrust: real AES-256-GCM / RSA-PSS / ECDSA via the JDK's own JCE
    #               providers, with key material in a PKCS#12 keystore. No cloud account and no
    #               network call, so it is the fastest way to exercise the real crypto paths
    #               locally or in CI. NOT for production: the KEK and signing keys live in the
    #               server's heap, so a heap dump or process compromise exposes every key ever
    #               wrapped. Set `software.keystore-path` + `software.keystore-password` to persist
    #               key material across restarts; leave the path empty for an ephemeral keystore.
    # "aws-kms"   — AwsKmsRootOfTrust against the configured AWS region. Requires `aws-kms.region`
    #               and `aws-kms.kek-arn` (the ARN of the customer master key used as the KEK in
    #               layered-mode key generation). Credentials come from the AWS SDK default
    #               provider chain (env vars, instance metadata, SSO, etc.).
    # GCP / Azure / Vault / PKCS#11 adapters are roadmapped for v0.3.0 / v0.4.0.
    kind = "in-memory"
    kind = ${?AEGIS_CRYPTO_KIND}

    software {
      # Empty = ephemeral in-heap keystore. Every key wrapped against it becomes unrecoverable
      # when the JVM exits, which is what you want in CI and nowhere else. Set a path (e.g.
      # /var/lib/aegis/keystore.p12) to persist across restarts; the file is created with
      # owner-only permissions and holds raw key material — treat it as you would a private key.
      keystore-path     = ""
      keystore-path     = ${?AEGIS_CRYPTO_SOFTWARE_KEYSTORE_PATH}
      # Required whenever keystore-path is set. Boot fails fast if it is missing.
      keystore-password = ""
      keystore-password = ${?AEGIS_CRYPTO_SOFTWARE_KEYSTORE_PASSWORD}
    }

    # "gcp-kms"   — GcpKmsRootOfTrust against Google Cloud KMS. Requires project-id, location,
    #               key-ring, and crypto-key. Credentials come from Application Default
    #               Credentials (GOOGLE_APPLICATION_CREDENTIALS, workload identity, or the GCE
    #               metadata server). Cloud KMS keys are single-purpose, so a deployment that both
    #               encrypts and signs needs a second key — set `signing-key` for that; leaving it
    #               empty is correct only if you never call sign/verify.
    gcp-kms {
      project-id = ""
      project-id = ${?AEGIS_CRYPTO_GCP_KMS_PROJECT_ID}
      location   = ""
      location   = ${?AEGIS_CRYPTO_GCP_KMS_LOCATION}
      key-ring   = ""
      key-ring   = ${?AEGIS_CRYPTO_GCP_KMS_KEY_RING}
      crypto-key = ""
      crypto-key = ${?AEGIS_CRYPTO_GCP_KMS_CRYPTO_KEY}

      # Optional separate asymmetric key for sign/verify. Cloud KMS addresses asymmetric
      # operations at a specific CryptoKeyVersion, hence the version below.
      signing-key         = ""
      signing-key         = ${?AEGIS_CRYPTO_GCP_KMS_SIGNING_KEY}
      signing-key-version = "1"
      signing-key-version = ${?AEGIS_CRYPTO_GCP_KMS_SIGNING_KEY_VERSION}
    }

    # "azure-key-vault" — AzureKeyVaultRootOfTrust against Key Vault or Managed HSM. Requires the
    #               full key URL. Credentials come from DefaultAzureCredential (env, workload
    #               identity, managed identity, or the Azure CLI). Key Vault has no data-key
    #               generation, so DEK material is generated in-process and wrapped — unlike AWS,
    #               where it originates in the HSM. Set `symmetric = true` only for a Managed HSM
    #               oct-HSM key; an RSA key cannot carry an encryption context at all (RSA-OAEP has
    #               no AAD input) and Aegis will reject requests that supply one rather than
    #               silently dropping it.
    azure-key-vault {
      key-identifier = ""
      key-identifier = ${?AEGIS_CRYPTO_AZURE_KEY_IDENTIFIER}
      symmetric      = false
      symmetric      = ${?AEGIS_CRYPTO_AZURE_SYMMETRIC}
    }

    # "vault-transit" — VaultTransitRootOfTrust against HashiCorp Vault's Transit engine. Of the
    #               non-AWS backends this is the only one with native data-key generation, so DEK
    #               material originates in Vault rather than in this process. Token renewal is the
    #               operator's concern (Vault Agent or a Kubernetes auth sidecar); this adapter
    #               presents a static token and does not implement a login flow. Transit keys are
    #               type-specific, so signing needs its own ecdsa-p256 / rsa-2048 key.
    vault-transit {
      address          = ""
      address          = ${?AEGIS_CRYPTO_VAULT_ADDRESS}
      token            = ""
      token            = ${?AEGIS_CRYPTO_VAULT_TOKEN}
      key-name         = ""
      key-name         = ${?AEGIS_CRYPTO_VAULT_KEY_NAME}
      mount            = "transit"
      mount            = ${?AEGIS_CRYPTO_VAULT_MOUNT}
      signing-key-name = ""
      signing-key-name = ${?AEGIS_CRYPTO_VAULT_SIGNING_KEY_NAME}
      namespace        = ""
      namespace        = ${?AEGIS_CRYPTO_VAULT_NAMESPACE}
    }

    aws-kms {
      region  = ""
      region  = ${?AEGIS_CRYPTO_AWS_KMS_REGION}
      kek-arn = ""
      kek-arn = ${?AEGIS_CRYPTO_AWS_KMS_KEK_ARN}
    }
  }

  audit {
    # "stdout"   — write every AuditRecord to stdout (default; what the docs/demos use).
    # "postgres" — write every AuditRecord to the `aegis_audit_events` table, indexed for the
    #              audit-read API (#20). Schema bootstraps on startup. Reuses the journal's
    #              Postgres credentials so operators only configure one set of DB env vars.
    kind = "stdout"
    kind = ${?AEGIS_AUDIT_KIND}

    retention {
      # Days of audit history to retain. `pruneBefore(now - days)` runs daily inside
      # `Server.boot`'s background fiber. Set to 0 to disable pruning entirely (audit grows
      # unbounded — fine for low-volume demos, NOT for production). Compliance regimes typically
      # require 365 days (SOC 2) or 7 years for SOX; tune accordingly.
      days = 365
      days = ${?AEGIS_AUDIT_RETENTION_DAYS}
    }

    # Optional SIEM webhook fan-out (#21). When `enabled=true`, every audit record is fanned out
    # to BOTH the primary durable sink (above) AND an async HTTPS POST to `url`. Primary failures
    # propagate (durability); webhook failures are bounded by retry + dead-letter (best-effort).
    # Typical production setup: `kind=postgres` (for the audit-read API #20) PLUS
    # `webhook.enabled=true` (for the SIEM).
    webhook {
      enabled = false
      enabled = ${?AEGIS_AUDIT_WEBHOOK_ENABLED}

      # HTTPS endpoint that receives one JSON-encoded AuditRecord per POST. Required when
      # enabled. Boot fails fast on empty URL.
      url = ""
      url = ${?AEGIS_AUDIT_WEBHOOK_URL}

      # HMAC-SHA256 signing key. Every POST carries `X-Aegis-Signature: sha256=<hex>` over the
      # raw body. Required when enabled (≥32 bytes recommended). Boot fails fast on empty secret.
      secret = ""
      secret = ${?AEGIS_AUDIT_WEBHOOK_SECRET}

      # Per-record retry budget. After this many consecutive transport / 5xx failures, the record
      # lands in the dead-letter file. 4xx responses (auth, malformed body) skip retry entirely.
      max-retries = 5
      max-retries = ${?AEGIS_AUDIT_WEBHOOK_MAX_RETRIES}

      # Initial backoff. Exponential thereafter, capped at max-backoff.
      initial-backoff-ms = 500
      initial-backoff-ms = ${?AEGIS_AUDIT_WEBHOOK_INITIAL_BACKOFF_MS}
      max-backoff-ms     = 30000
      max-backoff-ms     = ${?AEGIS_AUDIT_WEBHOOK_MAX_BACKOFF_MS}

      # JSONL dead-letter file. One record per line; safe to `cat dlq | xargs -I{} curl -d {}` to
      # re-deliver after the SIEM is back. Parent directory is auto-created on first write.
      dead-letter-file = "/var/lib/aegis/audit-webhook-dlq.jsonl"
      dead-letter-file = ${?AEGIS_AUDIT_WEBHOOK_DEAD_LETTER_FILE}

      # Bounded queue capacity. When the SIEM is slower than the audit rate, this fills up and
      # `write` blocks — which back-propagates through AuditingKeyService to the KMS call site.
      # The blocking is deliberate (silent drop would defeat the purpose of having an audit log).
      queue-capacity = 1024
      queue-capacity = ${?AEGIS_AUDIT_WEBHOOK_QUEUE_CAPACITY}
    }

    # Optional Kafka audit fan-out (#22). When `enabled=true`, every audit record fans out to
    # BOTH the primary durable sink AND a Kafka topic via an idempotent producer (acks=all,
    # enable.idempotence=true). Same DLQ semantics as the webhook sink. Typical streaming-export
    # setup: `kind=postgres` (for the audit-read API) PLUS `kafka.enabled=true` (for SIEM /
    # downstream consumers).
    kafka {
      enabled = false
      enabled = ${?AEGIS_AUDIT_KAFKA_ENABLED}

      # Comma-separated broker list. Required when enabled.
      bootstrap-servers = ""
      bootstrap-servers = ${?AEGIS_AUDIT_KAFKA_BOOTSTRAP_SERVERS}

      # Topic to publish to. Required when enabled. Operators typically pre-create with the
      # desired partition count + retention.
      topic = ""
      topic = ${?AEGIS_AUDIT_KAFKA_TOPIC}

      # Kafka client.id for broker-side identification and ACL routing.
      client-id = "aegis-audit"
      client-id = ${?AEGIS_AUDIT_KAFKA_CLIENT_ID}

      max-retries        = 5
      max-retries        = ${?AEGIS_AUDIT_KAFKA_MAX_RETRIES}
      initial-backoff-ms = 500
      initial-backoff-ms = ${?AEGIS_AUDIT_KAFKA_INITIAL_BACKOFF_MS}
      max-backoff-ms     = 30000
      max-backoff-ms     = ${?AEGIS_AUDIT_KAFKA_MAX_BACKOFF_MS}

      dead-letter-file = "/var/lib/aegis/audit-kafka-dlq.jsonl"
      dead-letter-file = ${?AEGIS_AUDIT_KAFKA_DEAD_LETTER_FILE}

      queue-capacity = 1024
      queue-capacity = ${?AEGIS_AUDIT_KAFKA_QUEUE_CAPACITY}

      # How long Producer.send() blocks waiting for metadata before raising a TimeoutException.
      # Kafka's default of 60s is fine for production (gives transient broker outages time to
      # recover) but unbounded in tests pointing at a dead broker — operators rarely need to
      # tune this knob.
      max-block-ms = 60000
      max-block-ms = ${?AEGIS_AUDIT_KAFKA_MAX_BLOCK_MS}
    }

    # Optional NATS JetStream audit fan-out (#23). Mirrors the Kafka sink for shops standardised
    # on NATS for messaging. Uses `publishAsync` + PubAck for durability — the drain fiber only
    # ack's a record once JetStream has durably persisted it.
    nats {
      enabled = false
      enabled = ${?AEGIS_AUDIT_NATS_ENABLED}

      # Comma-separated NATS URLs. Required when enabled.
      servers = ""
      servers = ${?AEGIS_AUDIT_NATS_SERVERS}

      # JetStream stream name. Required when enabled.
      stream = "AEGIS_AUDIT"
      stream = ${?AEGIS_AUDIT_NATS_STREAM}

      # Subject to publish to. Required when enabled.
      subject = "aegis.audit"
      subject = ${?AEGIS_AUDIT_NATS_SUBJECT}

      # Idempotently create the stream on boot if it doesn't already exist. Operators with their
      # own provisioning flow (NATS CLI / Terraform / Crossplane) should set this to `false` and
      # pre-create the stream with their desired retention + storage config.
      auto-create-stream = true
      auto-create-stream = ${?AEGIS_AUDIT_NATS_AUTO_CREATE_STREAM}

      # Optional path to a NATS .creds file produced by `nsc add user --csv`. Empty for
      # unauthenticated NATS (typical dev / single-server setup).
      credentials-file = ""
      credentials-file = ${?AEGIS_AUDIT_NATS_CREDENTIALS_FILE}

      max-retries        = 5
      max-retries        = ${?AEGIS_AUDIT_NATS_MAX_RETRIES}
      initial-backoff-ms = 500
      initial-backoff-ms = ${?AEGIS_AUDIT_NATS_INITIAL_BACKOFF_MS}
      max-backoff-ms     = 30000
      max-backoff-ms     = ${?AEGIS_AUDIT_NATS_MAX_BACKOFF_MS}

      dead-letter-file = "/var/lib/aegis/audit-nats-dlq.jsonl"
      dead-letter-file = ${?AEGIS_AUDIT_NATS_DEAD_LETTER_FILE}

      queue-capacity = 1024
      queue-capacity = ${?AEGIS_AUDIT_NATS_QUEUE_CAPACITY}
    }
  }
}

pekko {
  loglevel        = "INFO"
  loggers         = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  logging-filter  = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"

  http {
    server {
      # Populate `AttributeKeys.remoteAddress` on every incoming request so
      # `Endpoints.sourceIpInput` can read the socket's remote address and HttpRoutes
      # can stamp it into `AuditRecord.context("source.ip")` (closes #78). Default
      # in pekko-http is `off` for backwards compatibility, but the SourceIpBaseline
      # anomaly detector is inert without it.
      remote-address-attribute = on
    }
  }
}
